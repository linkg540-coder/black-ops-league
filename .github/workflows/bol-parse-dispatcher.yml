name: BOL Parse Dispatcher

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Jarvis for pending scoreboard pics
        env:
          KEY: ${{ secrets.AGENT_API_KEY }}
        run: |
          set -e
          IDS=$(curl -s "https://solene-11f8ed2a.base44.app/functions/bolPendingList" -H "User-Agent: Mozilla/5.0" | python3 -c "import sys,json;d=json.load(sys.stdin);print(' '.join(r['id'] for r in d.get('pending',[])))" || true)
          echo "pending: ${IDS:-none}"
          for ID in $IDS; do
            CLAIM=$(curl -s -X POST "https://solene-11f8ed2a.base44.app/functions/bolPendingList" -H "Content-Type: application/json" -H "User-Agent: Mozilla/5.0" -d "{\"id\":\"$ID\"}")
            echo "claim $ID -> $CLAIM"
            MSG="BOL dispatcher task: parse BolParse record $ID (a scoreboard pic is waiting). Steps: (1) bash: curl -s 'https://solene-11f8ed2a.base44.app/functions/bolReassemble?id=$ID' -o /tmp/bol.json then decode the b64 field to /tmp/bol.jpg (must be >10KB, else report error). (2) bash: POST the jpg to catbox.moe: curl -s -F 'reqtype=fileupload' -F 'fileToUpload=@/tmp/bol.jpg' https://catbox.moe/user/api.php -> public URL. (3) local_browser_navigate to that URL, then local_browser_screenshot to read the scoreboard (BO3 zombies end screen; extract map, round, and EVERY player's name/score/kills/headshots/revives; never invent numbers; map must be one of the BO3 zombie maps or null). ACCEPTANCE CHECK — MANDATORY: only accept the pic if it clearly shows the end-game header 'You Survived ... Rounds'. A mid-match scoreboard, round indicator, or any pic WITHOUT the Survived text is NOT a valid end screen → reject it with status error and errorNote 'Not an end-game scoreboard — take the pic of the screen that says You Survived'. Never report a done result for a pic that lacks the Survived header. DUPLICATE CHECK — MANDATORY: before posting done, compute the fingerprint: lowercase map + '#' + round + '#' + each player's 'score,kills,headshots,revives' joined by '|' and sorted alphabetically. Then POST a JSON body with fields id and fingerprint to https://solene-11f8ed2a.base44.app/functions/bolDupeCheck. If it returns dupe:true, do NOT post a done result — post status error with errorNote 'Duplicate match — already logged by <account from the check>'. If dupe:false, proceed with the done result as normal. Only exact deterministic fingerprint matches count as dupes; never guess or discard on suspicion. (4) bash: POST to https://solene-11f8ed2a.base44.app/functions/bolParseResult with JSON {\"id\":\"$ID\",\"status\":\"done\",\"resultJson\":\"{...}\"} (or status error + errorNote if unreadable). (5) bash: verify with https://solene-11f8ed2a.base44.app/functions/bolParseStatus?id=$ID — must show done or error. Do all of this yourself now; do not ask the user anything. Reply with one short line of what you read."
            PAYLOAD=$(python3 -c "import json,sys;print(json.dumps({'role':'user','content':sys.argv[1]}))" "$MSG")
            RESP=$(curl -s -m 600 -X POST "https://app.base44.com/api/agents/6a704fd9688b1feb11f8ed2a/conversations/6a98b660c99bc0dbf5442028/messages" \
              -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -H "User-Agent: Mozilla/5.0" \
              -d "$PAYLOAD")
            echo "agent response: ${RESP:0:200}"
          done
